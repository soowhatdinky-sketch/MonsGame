<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="0 0 260 260" role="img" aria-labelledby="title desc" focusable="false">
  <title id="title">Nemotron Nano Identity</title>
  <desc id="desc">A geometric monogram-style identity mark for Nemotron-3-Nano sandbox documentation.</desc>
  <defs>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="core" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
  </defs>
  <rect x="12" y="12" width="236" height="236" rx="32" fill="url(#ring)"/>
  <rect x="28" y="28" width="204" height="204" rx="22" fill="#0b1220"/>
  <polygon points="50,90 130,30 210,90 130,150" fill="none" stroke="url(#core)" stroke-width="8"/>
  <circle cx="130" cy="128" r="40" fill="none" stroke="#67e8f9" stroke-width="8"/>
  <rect x="82" y="132" width="96" height="12" rx="6" fill="#22d3ee"/>
  <rect x="82" y="154" width="66" height="12" rx="6" fill="#0ea5e9"/>
  <rect x="82" y="176" width="76" height="12" rx="6" fill="#22d3ee"/>
  <circle cx="130" cy="128" r="16" fill="#22d3ee"/>
</svg>
